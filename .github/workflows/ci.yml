name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python 3.11, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install "poetry>=2.0,<3"

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Read locked Torch version
        id: torch
        run: |
          TORCH_VERSION=$(python3 -c "
          import re
          from pathlib import Path
          text = Path('poetry.lock').read_text()
          match = re.search(r'(?m)^name = \"torch\"\nversion = \"([^\"]+)\"', text)
          if not match:
              raise SystemExit('torch not found in poetry.lock')
          print(match.group(1))
          ")
          echo "version=${TORCH_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Locked torch: ${TORCH_VERSION}"

      - name: Install CPU PyTorch
        run: |
          poetry env use 3.11
          poetry run pip install --upgrade pip
          poetry run pip install "torch==${{ steps.torch.outputs.version }}+cpu" --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          poetry install --with dev --no-interaction
          # Poetry may pull a non-CPU torch wheel; pin CPU torch again.
          poetry run pip install --force-reinstall "torch==${{ steps.torch.outputs.version }}+cpu" --index-url https://download.pytorch.org/whl/cpu

      - name: Install torch-geometric (best effort)
        id: pyg
        continue-on-error: true
        run: |
          poetry run pip install "torch-geometric>=2.3.0,<3"
          poetry run pip install pyg_lib torch_scatter torch_sparse torch_cluster torch_spline_conv \
            -f "https://data.pyg.org/whl/torch-${{ steps.torch.outputs.version }}+cpu.html"

      - name: Show environment
        run: |
          poetry run python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          poetry run python -c "import torch_geometric; print('torch_geometric', torch_geometric.__version__)" \
            || echo "torch_geometric not available (CNN/unit tests should still run)"

      - name: Run tests
        run: poetry run pytest tests/ -q --tb=short
