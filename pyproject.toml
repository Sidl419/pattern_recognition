[tool.poetry]
name = "pattern-recognition"
version = "0.1.0"
description = ""
authors = ["Leonid Sidorov <leon.sidorov@gmail.com>"]
readme = "README.md"
packages = [{include = "pattern_recognition"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
torch = "2.0.0"
torch-geometric = "^2.3.0"
mne = "^1.3.1"
pandas = "^1.5.3"
numpy = "^1.24.2"
scipy = "^1.10.1"
matplotlib = "^3.7.1"
tqdm = "^4.65.0"
networkx = "^3.0"
scikit-learn = "^1.2.2"
captum = "^0.6.0"
ipykernel = "^6.22.0"
statsmodels = "^0.13.5"
openpyxl = "^3.1.2"
seaborn = "^0.13.0"
torchviz = "^0.0.3"
visualtorch = "^0.2.4"
onnx = "^1.18.0"
onnxscript = "^0.3.2"
pkg = "^0.2"
setuptools = "^80.9.0"
pydantic = "^2.0.0"
joblib = "^1.3.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.16.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
    "ignore:np.find_common_type is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["pattern_recognition", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# Start light: style hygiene without forcing a large first-pass rewrite.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Historical file defines two EEGNet variants; renaming is out of scope for tooling setup.
"pattern_recognition/models/cnn.py" = ["F811"]

