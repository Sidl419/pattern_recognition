[tool.poetry]
name = "pattern-recognition"
version = "0.1.0"
description = ""
authors = ["Leonid Sidorov <leon.sidorov@gmail.com>"]
readme = "README.md"
packages = [{include = "pattern_recognition"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
# Loose pins so Colab (Py 3.12 + system Torch/NumPy 2.x) can `pip install` in one command.
torch = ">=2.0.0,<3.0.0"
numpy = ">=1.24.2,<3"
mne = "^1.3.1"
pandas = ">=1.5.3,<3"
scipy = ">=1.10.1,<2"
matplotlib = ">=3.7.1,<4"
tqdm = ">=4.65.0,<5"
networkx = ">=3.0,<4"
scikit-learn = ">=1.2.2,<2"
# ipykernel is provided by Colab / local Jupyter — do not pin it as a required dep
# (upgrading it on Colab breaks google-colab / jupyter-client pins).
statsmodels = ">=0.13.5,<1"
openpyxl = ">=3.1.2,<4"
seaborn = ">=0.13.0,<1"
setuptools = ">=65.0.0"
pydantic = ">=2.0.0,<3"
joblib = ">=1.3.0,<2"
# Optional: GNN / viz stack (historical notebooks). Install with: pip install ".[gnn,viz]"
torch-geometric = {version = ">=2.3.0,<3", optional = true}
captum = {version = ">=0.6.0,<1", optional = true}
torchviz = {version = ">=0.0.3,<1", optional = true}
visualtorch = {version = ">=0.2.4,<1", optional = true}
onnx = {version = ">=1.14.0,<2", optional = true}
onnxscript = {version = ">=0.1.0,<1", optional = true}
pkg = {version = ">=0.2,<1", optional = true}

[tool.poetry.extras]
gnn = ["torch-geometric", "captum"]
viz = ["torchviz", "visualtorch", "onnx", "onnxscript", "pkg"]
all = ["torch-geometric", "captum", "torchviz", "visualtorch", "onnx", "onnxscript", "pkg"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.16.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
    "ignore:np.find_common_type is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["pattern_recognition", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# Start light: style hygiene without forcing a large first-pass rewrite.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Historical file defines two EEGNet variants; renaming is out of scope for tooling setup.
"pattern_recognition/models/cnn.py" = ["F811"]
